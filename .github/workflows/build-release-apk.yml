name: Build & Upload Signed aFreeRDP Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      abi_filters:
        description: 'Target ABIs (separated by semicolon)'
        required: false
        default: 'arm64-v8a;x86_64'

jobs:
  build-afreerdp:
    name: Build & Sign aFreeRDP Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config nasm ninja-build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Delete old Android SDK cmdline-tools
        run: |
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > client/Android/Studio/release.jks

      - name: Prepare release.properties
        run: |
          # Detect or install NDK
          NDK_VER=$(ls -1 "$ANDROID_HOME/ndk" 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_VER" ]; then
            echo "Installing NDK 28..."
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.12674087"
            NDK_VER="28.0.12674087"
          fi
          echo "Using NDK: $NDK_VER"

          # Detect or install CMake
          CMAKE_VER=$(ls -1 "$ANDROID_HOME/cmake" 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$CMAKE_VER" ]; then
            echo "Installing CMake 3.22.1..."
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1"
            CMAKE_VER="3.22.1"
          fi
          echo "Using CMake: $CMAKE_VER"

          cat <<EOF > client/Android/Studio/release.properties
          RELEASE_STORE_FILE=release.jks
          RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          COMPILE_API=36
          TARGET_API=36
          MIN_API=29
          TOOLS_VERSION=36.0.0
          NDK_VERSION=$NDK_VER
          CMAKE_VERSION=$CMAKE_VER
          SPLIT_ENABLED=true
          BUILD_UNIVERSAL=true
          SPLIT_ARCHITECTURES=${{ inputs.abi_filters || 'arm64-v8a;x86_64' }}
          ABI_FILTERS=${{ inputs.abi_filters || 'arm64-v8a;x86_64' }}
          APPLICATION_ID=com.freerdp.afreerdp.custom
          EOF
          cat client/Android/Studio/release.properties

      - name: Build aFreeRDP Release APK
        run: |
          cd client/Android/Studio
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Signed APKs
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"
          for apk in $(find client/Android/Studio/aFreeRDP/build/outputs/apk/release -name "*.apk"); do
            echo "----------------------------------------"
            echo "Verifying APK: $apk"
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Upload Signed aFreeRDP Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: aFreeRDP-release-signed
          path: client/Android/Studio/aFreeRDP/build/outputs/apk/release/*.apk
          if-no-files-found: error
